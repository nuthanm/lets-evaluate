name: Quality Tests

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: web

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply quality dashboard migration
        run: npm run db:migrate:quality
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run quality suite and publish stats
        run: npm run test:quality
        env:
          CI: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-test-results
          path: |
            web/test-results/
            web/public/quality-stats.json

      - name: Upload quality stats for deployment
        uses: actions/upload-artifact@v4
        with:
          name: quality-stats-json
          path: web/public/quality-stats.json
